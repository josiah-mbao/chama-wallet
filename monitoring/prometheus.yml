global:
  scrape_interval: 15s  # How often to scrape targets by default
  evaluation_interval: 15s  # How often to evaluate rules

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'chama-wallet-api'
    static_configs:
      - targets: ['api:8000']  # Target the API container on port 8000
        labels:
          service: 'fastapi'

  # Scraping Celery worker exporter if we add one later
  # - job_name: 'celery-worker'
  #   static_configs:
  #     - targets: ['celery_worker:8080']

  # Scraping Redis exporter if we add one later
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:9121']
