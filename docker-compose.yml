services:
  api:
    build: ./backend  # Dockerfile is still in backend
    working_dir: /app  # Root of the mounted project
    command: >
      sh -c "
        export PYTHONPATH=/app &&
        echo 'Waiting for PostgreSQL at db:5432 to be ready...' &&
        until nc -z -v -w30 db 5432; do echo 'PostgreSQL is unavailable - sleeping'; sleep 1; done &&
        echo 'PostgreSQL is up and running. Applying migrations.' &&
        cd backend && alembic upgrade head &&
        echo 'Starting FastAPI application' &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount entire project so tests/ and backend/ are available
    env_file:
      - ./backend/.env  # Keep your env in backend
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chamauser
      - POSTGRES_PASSWORD=chamapassword
      - POSTGRES_DB=chamadb
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build: ./backend
    working_dir: /app
    command: ["sh", "-c", "PYTHONPATH=/app celery -A backend.celery_app worker --loglevel=info"]
    volumes:
      - .:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/chama-dashboard.json
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
