[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --cov=backend
    --cov-report=term-missing
    --cov-report=xml:test-reports/coverage.xml
    --junit-xml=test-reports/results.xml
filterwarnings =
    ignore::DeprecationWarning
