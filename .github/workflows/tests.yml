name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: chamauser
          POSTGRES_PASSWORD: chamapassword
          POSTGRES_DB: chamadb
        options: >-
          --health-cmd "pg_isready -U chamauser -d chamadb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://chamauser:chamapassword@localhost:5432/chamadb
      PYTHONPATH: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U chamauser; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings --cov=backend --cov-report=xml
